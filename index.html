<title>Stormtoren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: één scherm, canvas vult alles; HUD zweeft erboven met safe-area-insets. Eén donkere stormwereld, bewust single-theme. */
:root {
  --ink: #12172e;        /* diep stormindigo */
  --sky: #2b3866;
  --dusk: #d9805f;       /* warme gloed aan de horizon */
  --sea: #0f3a4a;
  --foam: #d6ecf2;
  --gold: #ffd166;
  --paper: #f3f1ff;
  --muted: #a8b2d8;
  --danger: #ff5d8f;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Baloo 2", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--paper); font-family: var(--body);
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: fixed; inset: 0; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

/* HUD */
#hud {
  position: absolute; left: 0; right: 0; top: 0; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px;
  opacity: 0; transform: translateY(-12px); transition: opacity .35s, transform .35s;
}
#hud.on { opacity: 1; transform: none; }
.lives { display: flex; gap: 4px; padding-top: 6px; }
.heart { width: 26px; height: 24px; display: block; transition: transform .2s; filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
.heart path { fill: var(--danger); stroke: #7a1f3d; stroke-width: 2; }
.heart.gone { animation: heartbreak .7s forwards; }
@keyframes heartbreak {
  0% { transform: scale(1); }
  20% { transform: scale(1.5) rotate(-12deg); }
  100% { transform: scale(.75) rotate(8deg); opacity: .22; filter: grayscale(1); }
}
.height { text-align: center; line-height: .9; }
.hval {
  font-family: var(--display); font-size: 46px; letter-spacing: .5px;
  font-variant-numeric: tabular-nums; text-shadow: 0 3px 0 rgba(0,0,0,.35);
  display: inline-block;
}
.hval.bump { animation: bump .35s cubic-bezier(.3,1.8,.5,1); }
@keyframes bump { 0% { transform: scale(1.28); color: var(--gold); } 100% { transform: scale(1); } }
.hunit { font-size: 12px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.next {
  width: 64px; padding: 6px 4px 4px; border-radius: 16px;
  background: rgba(14,19,42,.55); border: 2px solid rgba(255,255,255,.08);
  display: flex; flex-direction: column; align-items: center;
}
.next canvas { width: 54px; height: 44px; display: block; }
.next span { font-size: 10px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
.btns { display: flex; gap: 6px; pointer-events: auto; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 12px; border: 2px solid rgba(255,255,255,.1);
  background: rgba(14,19,42,.55); color: var(--paper); display: grid; place-items: center;
  cursor: pointer; touch-action: manipulation; padding: 0;
}
.icon-btn:focus-visible, .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.icon-btn svg { width: 18px; height: 18px; }

#wind {
  position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 92px);
  transform: translateX(-50%); pointer-events: none;
  display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 10px; border-radius: 999px;
  background: rgba(214,236,242,.12); border: 2px solid rgba(214,236,242,.25);
  font-weight: 800; font-size: 14px; letter-spacing: .4px; color: var(--foam);
}
#wind.warn { animation: blink .4s infinite alternate; }
@keyframes blink { to { background: rgba(214,236,242,.28); } }
#wind svg { width: 26px; height: 16px; }

#banner {
  position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none;
  opacity: 0;
}
#banner.show { animation: banner 1.8s cubic-bezier(.2,1.4,.4,1) forwards; }
@keyframes banner {
  0% { opacity: 0; transform: scale(.4) rotate(-6deg); }
  14% { opacity: 1; transform: scale(1.08) rotate(2deg); }
  24% { transform: scale(1) rotate(0); }
  80% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.1) translateY(-20px); }
}
#banner b { display: block; font-family: var(--display); font-size: 64px; color: var(--gold); text-shadow: 0 4px 0 #8a5a00, 0 10px 30px rgba(0,0,0,.4); line-height: 1; }
#banner span { display: block; font-weight: 800; font-size: 18px; margin-top: 6px; text-shadow: 0 2px 0 rgba(0,0,0,.4); }

#hint {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 104px); transform: translateX(-50%);
  display: flex; gap: 8px; pointer-events: none; transition: opacity .5s; flex-wrap: wrap; justify-content: center;
  width: max-content; max-width: calc(100% - 32px);
}
#hint.off { opacity: 0; }
#pad {
  position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: space-between; align-items: flex-end;
}
.pad-group { display: flex; gap: 12px; pointer-events: auto; }
.pad-btn {
  width: 68px; height: 68px; border-radius: 20px; padding: 0; cursor: pointer; touch-action: none;
  background: rgba(14,19,42,.62); border: 2px solid rgba(255,255,255,.14); color: var(--paper);
  display: grid; place-items: center; box-shadow: 0 5px 0 rgba(0,0,0,.35);
  transition: transform .06s, box-shadow .06s, background .06s;
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.pad-btn svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.pad-btn.pressed { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.35); background: rgba(255,209,102,.28); border-color: rgba(255,209,102,.6); }
.pad-rot { background: rgba(255,209,102,.2); border-color: rgba(255,209,102,.45); color: var(--gold); }
.pad-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.chip {
  padding: 6px 12px; border-radius: 999px; background: rgba(10,14,32,.6); border: 2px solid rgba(255,255,255,.12);
  font-weight: 700; font-size: 13px; color: var(--paper); white-space: nowrap;
}
.chip kbd { font-family: var(--display); color: var(--gold); font-size: 14px; margin-right: 4px; }

/* overlays */
.overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(20px, env(safe-area-inset-left, 0px));
  background: radial-gradient(ellipse at 50% 40%, rgba(18,23,46,.72), rgba(12,16,34,.95));
  text-align: center; gap: 18px;
}
.title { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 360px; }
.title .row { display: flex; gap: 4px; }
.title i {
  font-style: normal; font-family: var(--display); font-size: clamp(30px, 10vw, 46px); line-height: 1;
  width: 1.18em; height: 1.18em; display: grid; place-items: center; border-radius: .22em; color: #fff;
  box-shadow: inset 0 -.12em 0 rgba(0,0,0,.28), inset 0 .07em 0 rgba(255,255,255,.35), 0 .08em 0 rgba(0,0,0,.35);
  text-shadow: 0 .05em 0 rgba(0,0,0,.3);
  animation: dropin .6s cubic-bezier(.3,1.6,.5,1) both;
}
@keyframes dropin { from { transform: translateY(-260%) rotate(var(--r0)); } }
.tag { font-size: 17px; font-weight: 600; color: var(--muted); max-width: 30ch; line-height: 1.35; text-wrap: balance; }
.btn {
  font-family: var(--display); font-size: 26px; letter-spacing: .5px; color: #3b2600;
  background: var(--gold); border: 0; border-radius: 18px; padding: 14px 44px 16px; cursor: pointer;
  box-shadow: inset 0 -6px 0 rgba(0,0,0,.18), inset 0 3px 0 rgba(255,255,255,.5), 0 6px 0 #9a6a00, 0 14px 30px rgba(0,0,0,.35);
  transition: transform .08s, box-shadow .08s; touch-action: manipulation;
}
.btn:active { transform: translateY(5px); box-shadow: inset 0 -6px 0 rgba(0,0,0,.18), inset 0 3px 0 rgba(255,255,255,.5), 0 1px 0 #9a6a00, 0 6px 16px rgba(0,0,0,.35); }
.btn.ghost { background: rgba(255,255,255,.1); color: var(--paper); box-shadow: inset 0 -4px 0 rgba(0,0,0,.2), 0 4px 0 rgba(0,0,0,.3); font-size: 20px; padding: 10px 28px 12px; }
.record { font-weight: 800; font-size: 14px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--gold); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 360px; }
.over-h { font-family: var(--display); font-size: 40px; line-height: 1; text-shadow: 0 4px 0 rgba(0,0,0,.35); }
.big { font-family: var(--display); font-size: 84px; line-height: .9; color: var(--gold); text-shadow: 0 5px 0 #8a5a00; font-variant-numeric: tabular-nums; }
.big small { font-size: 32px; margin-left: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(340px, 100%); }
.stat { background: rgba(255,255,255,.07); border-radius: 14px; padding: 8px 4px; }
.stat b { display: block; font-family: var(--display); font-size: 24px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); }
.newrec { font-family: var(--display); color: var(--ink); background: var(--gold); padding: 4px 14px; border-radius: 999px; font-size: 18px; transform: rotate(-3deg); }
.stack { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* home: spelmodi */
.modes { display: flex; flex-direction: column; gap: 10px; width: min(360px, 100%); }
.mode {
  display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 14px; text-align: left;
  padding: 12px 14px 12px 12px; border-radius: 20px; border: 2px solid rgba(255,255,255,.12);
  background: rgba(14,19,42,.7); color: var(--paper); font-family: var(--body); cursor: pointer;
  box-shadow: 0 5px 0 rgba(0,0,0,.35); transition: transform .08s, box-shadow .08s; touch-action: manipulation;
}
.mode:not(.locked):active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.mode.open { border-color: rgba(255,209,102,.55); background: linear-gradient(180deg, rgba(255,209,102,.16), rgba(14,19,42,.75)); }
.mode:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.mode .ico { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: rgba(255,255,255,.07); }
.mode .ico svg { width: 40px; height: 40px; }
.mode b { display: block; font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1; }
.mode span span { display: block; font-size: 14px; font-weight: 600; color: var(--muted); line-height: 1.25; margin-top: 3px; }
.mode .go { font-family: var(--display); font-size: 15px; color: var(--ink); background: var(--gold); border-radius: 999px; padding: 5px 12px 6px; }
.mode.locked { cursor: default; opacity: .6; box-shadow: none; }
.mode .lock { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
.mode .lock svg { width: 20px; height: 20px; }

/* levelkeuze */
.lv-head { display: flex; align-items: center; gap: 14px; width: min(360px, 100%); }
.lv-head .over-h { flex: 1; text-align: left; }
.lv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: min(360px, 100%); }
.lv {
  position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 10px 10px 9px;
  border-radius: 18px; border: 2px solid rgba(255,255,255,.12); background: rgba(14,19,42,.72); color: var(--paper);
  font-family: var(--body); cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.35); text-align: left; touch-action: manipulation;
  transition: transform .08s, box-shadow .08s;
}
.lv:not([disabled]):active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.lv:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.lv[disabled] { opacity: .45; cursor: default; box-shadow: none; }
.lv .top { display: flex; align-items: baseline; gap: 8px; padding-right: 20px; }
.lv .num { font-family: var(--display); font-size: 26px; line-height: 1; color: var(--gold); }
.lv .nm { font-weight: 700; font-size: 13px; line-height: 1.15; }
.lv svg.pf { width: 100%; height: 42px; display: block; }
.lv .st { display: flex; gap: 2px; }
.lv .st svg { width: 16px; height: 16px; }
.lv .lk { position: absolute; right: 10px; top: 10px; width: 18px; height: 18px; color: var(--muted); }

/* resultaat */
.stars { display: flex; gap: 6px; align-items: flex-end; }
.stars svg { width: 64px; height: 64px; animation: starpop .5s cubic-bezier(.3,1.8,.5,1) both; }
.stars svg:nth-child(2) { width: 78px; height: 78px; }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } }

.hudleft { display: flex; flex-direction: column; gap: 4px; }
.lvltag { padding-top: 2px; line-height: 1.05; }
.lvltag b { display: block; white-space: nowrap; font-family: var(--display); font-weight: 400; font-size: 19px; color: var(--gold); text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.lvltag span { display: block; white-space: nowrap; font-size: 12px; font-weight: 700; color: var(--muted); }


/* home: modus-kaarten met eigen accentkleur */
.mode { position: relative; overflow: hidden; }
.mode::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--mc, var(--gold)); }
.mode em { display: block; font-style: normal; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); margin-top: 4px; }
.mode em:empty { display: none; }
.mode .go { background: var(--mc, var(--gold)); }
.corner-btn { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(16px, env(safe-area-inset-right, 0px)); width: 44px; height: 44px; }
.corner-btn svg { width: 22px; height: 22px; }

/* uitlegkaart */
.intro-card {
  box-sizing: border-box; width: min(360px, 100%); padding: 24px 20px 20px; border-radius: 26px; text-align: left;
  background: linear-gradient(180deg, rgba(43,56,102,.95), rgba(18,23,46,.97)); border: 2px solid rgba(255,255,255,.12);
  box-shadow: 0 20px 50px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 14px; align-items: stretch;
  animation: cardin .45s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes cardin { from { transform: translateY(30px) scale(.92); opacity: 0; } }
.intro-card .btn { align-self: center; }
.intro-ico { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: rgba(255,255,255,.08); }
.intro-ico svg { width: 46px; height: 46px; }
.intro-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.intro-list li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font-size: 16px; font-weight: 600; line-height: 1.35; color: var(--paper); }
.intro-list li i { font-style: normal; font-family: var(--display); width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--gold); color: var(--ink); font-size: 16px; }

/* instellingen */
.set-list { width: min(360px, 100%); display: flex; flex-direction: column; border-radius: 20px; overflow: hidden; background: rgba(14,19,42,.72); border: 2px solid rgba(255,255,255,.1); }
.set-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; padding: 14px 16px;
  background: none; border: 0; color: var(--paper); font-family: var(--body); cursor: pointer; touch-action: manipulation;
}
.set-row + .set-row { border-top: 1px solid rgba(255,255,255,.08); }
.set-row b { display: block; font-size: 16px; font-weight: 800; }
.set-row span span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 2px; }
.set-row:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }
.set-row.danger b { color: var(--danger); }
.sw { flex: none; width: 50px; height: 30px; border-radius: 999px; background: rgba(255,255,255,.16); position: relative; transition: background .2s; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s cubic-bezier(.3,1.5,.5,1); box-shadow: 0 2px 4px rgba(0,0,0,.3); }
.set-row[aria-checked="true"] .sw { background: var(--success, #3ddc97); }
.set-row[aria-checked="true"] .sw::after { transform: translateX(20px); }
.fine { font-size: 12px; color: var(--muted); margin: 0; }

/* medaille */
.medal { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 15px; color: #2a1a00;
  box-shadow: inset 0 -6px 0 rgba(0,0,0,.2), inset 0 4px 0 rgba(255,255,255,.45), 0 6px 0 rgba(0,0,0,.3); animation: starpop .6s cubic-bezier(.3,1.8,.5,1) .2s both; }
.medal.gold { background: radial-gradient(circle at 35% 30%, #fff3b0, #ffd166 45%, #d99a1e); }
.medal.silver { background: radial-gradient(circle at 35% 30%, #ffffff, #cfd6ea 45%, #8d97c4); }
.medal.bronze { background: radial-gradient(circle at 35% 30%, #ffd9b8, #e0915a 45%, #9a5a2e); }

/* aftellen */
#count { position: absolute; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; font-family: var(--display);
  font-size: 110px; line-height: 1; color: #fff; text-shadow: 0 6px 0 rgba(0,0,0,.35), 0 0 40px rgba(255,209,102,.5); opacity: 0; }
#count.go { color: var(--gold); font-size: 72px; }
#count.show { animation: countpop .8s cubic-bezier(.2,1.5,.4,1) forwards; }
@keyframes countpop { 0% { opacity: 0; transform: scale(2.2); } 25% { opacity: 1; transform: scale(1); } 75% { opacity: 1; transform: scale(.95); } 100% { opacity: 0; transform: scale(.7); } }

@media (prefers-reduced-motion: reduce) {
  .title i, #banner.show, .hval.bump, #wind.warn, #count.show, .intro-card, .medal { animation-duration: .01s; }
}
</style>

<div id="app">
  <canvas id="cv" aria-label="Speelveld"></canvas>

  <div id="hud">
    <div class="hudleft">
      <div class="lives" id="lives" aria-label="Levens"></div>
      <div class="lvltag" id="lvlTag" hidden><b id="lvlNum"></b><span id="lvlName"></span></div>
    </div>
    <div class="height"><div class="hval" id="hval">0.0</div><div class="hunit" id="hunit">meter hoog</div></div>
    <div class="side">
      <div class="next"><canvas id="nextcv" width="108" height="88"></canvas><span>Volgende</span></div>
      <div class="btns">
        <button class="icon-btn" id="muteBtn" aria-label="Geluid aan of uit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="muteWaves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        </button>
        <button class="icon-btn" id="pauseBtn" aria-label="Pauze">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="wind" hidden>
    <svg id="windArrow" viewBox="0 0 26 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M2 5h14a3 3 0 1 0-3-3M2 11h19a3 3 0 1 1-3 3"/></svg>
    <span id="windText">Windstoot</span>
  </div>

  <div id="banner"><b id="bannerBig"></b><span id="bannerSub"></span></div>
  <div id="count" aria-live="polite"></div>

  <div id="pad" hidden>
    <div class="pad-group">
      <button class="pad-btn" data-act="left" aria-label="Naar links"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="pad-btn" data-act="right" aria-label="Naar rechts"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="pad-group">
      <button class="pad-btn" data-act="down" aria-label="Sneller laten vallen"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></button>
      <button class="pad-btn pad-rot" data-act="rotate" aria-label="Draaien"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M19 4v5h-5"/></svg></button>
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
'use strict';
const { Engine, Bodies, Body, Composite, Events, Query } = Matter;

/* ---------- constanten ---------- */
const CELL = 32;                 // wereldpixels per blokje
const M_PER_CELL = 0.5;          // 1 blokje = 0,5 meter
const PLATFORM_CELLS = 7;
const SEA_Y = 7 * CELL;
const SHAPES = {
  I: [[0,0],[1,0],[2,0],[3,0]],
  O: [[0,0],[1,0],[0,1],[1,1]],
  T: [[0,0],[1,0],[2,0],[1,1]],
  L: [[0,0],[0,1],[0,2],[1,2]],
  J: [[1,0],[1,1],[1,2],[0,2]],
  S: [[1,0],[2,0],[0,1],[1,1]],
  Z: [[0,0],[1,0],[1,1],[2,1]],
};
const COLORS = { I:'#4cc9f0', O:'#ffd166', T:'#c77dff', L:'#ff9f43', J:'#4d7cfe', S:'#3ddc97', Z:'#ff5d8f' };
const TYPES = Object.keys(SHAPES);
const PENTA = [0,2,4,7,9,12,14,16,19,21,24,26,28,31];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = matchMedia('(pointer: fine)').matches;

/* ---------- helpers ---------- */
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const rand = (a,b) => a + Math.random()*(b-a);
const easeOutBack = t => { const c1 = 1.9, c3 = c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
function shade(hex, amt) {
  const c = parseInt(hex.slice(1), 16);
  let r = c >> 16, g = (c >> 8) & 255, b = c & 255;
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return `rgb(${r},${g},${b})`;
}
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x+r, y); c.arcTo(x+w, y, x+w, y+h, r); c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r); c.arcTo(x, y, x+w, y, r); c.closePath();
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
const settings = Object.assign({ sfx: true, music: true, haptics: true, guide: true }, (() => { try { return JSON.parse(store('st_settings') || '{}') || {}; } catch (e) { return {}; } })());
if (store('st_muted') === '1' && store('st_settings') === null) settings.sfx = false;
function saveSettings() { store('st_settings', JSON.stringify(settings)); }

/* blokje tekenen: snoepachtig, met 3D-onderrand, glans en een ingekerfde voeg */
function drawCellRaw(c, x, y, s, color) {
  const r = s * 0.22;
  rr(c, x, y, s, s, r); c.fillStyle = shade(color, -0.42); c.fill();
  const g = c.createLinearGradient(0, y, 0, y + s);
  g.addColorStop(0, shade(color, 0.22)); g.addColorStop(0.55, color); g.addColorStop(1, shade(color, -0.1));
  rr(c, x + s*0.045, y + s*0.035, s*0.91, s*0.83, r*0.85); c.fillStyle = g; c.fill();
  // ingekerfd vlak
  rr(c, x + s*0.26, y + s*0.3, s*0.48, s*0.36, s*0.1);
  c.fillStyle = shade(color, -0.12); c.fill();
  rr(c, x + s*0.26, y + s*0.33, s*0.48, s*0.33, s*0.1);
  c.fillStyle = shade(color, 0.06); c.fill();
  // glansstreep
  rr(c, x + s*0.15, y + s*0.1, s*0.7, s*0.13, s*0.065); c.fillStyle = 'rgba(255,255,255,.42)'; c.fill();
  c.beginPath(); c.arc(x + s*0.82, y + s*0.2, s*0.045, 0, 7); c.fillStyle = 'rgba(255,255,255,.7)'; c.fill();
}

/* heel stuk tekenen als één massief blok: één omlijning, strakke hoeken, per vakje een gebevelde tegel */
function pieceBox(type) {
  const cells = SHAPES[type];
  return { w: Math.max(...cells.map(c => c[0])) + 1, h: Math.max(...cells.map(c => c[1])) + 1 };
}
function drawPieceRaw(c, type, s, ox, oy, mode) {
  const cells = SHAPES[type], set = new Set(cells.map(([x, y]) => x + ',' + y));
  const has = (x, y) => set.has(x + ',' + y);
  if (mode === 'white' || mode === 'shadow') {
    c.fillStyle = mode === 'white' ? '#ffffff' : '#05081a';
    for (const [x, y] of cells) c.fillRect(ox + x * s, oy + y * s, s, s);
    return;
  }
  const color = COLORS[type], b = Math.max(1, s * 0.075);
  c.fillStyle = shade(color, -0.55);
  for (const [x, y] of cells) c.fillRect(ox + x * s, oy + y * s, s, s);
  for (const [x, y] of cells) {
    const l = has(x - 1, y) ? 0 : b, r = has(x + 1, y) ? 0 : b, t = has(x, y - 1) ? 0 : b, bt = has(x, y + 1) ? 0 : b * 2.4;
    const X = ox + x * s, Y = oy + y * s;
    const g = c.createLinearGradient(0, Y, 0, Y + s);
    g.addColorStop(0, shade(color, 0.12)); g.addColorStop(1, shade(color, -0.12));
    c.fillStyle = g; c.fillRect(X + l, Y + t, s - l - r, s - t - bt);
    if (!has(x, y - 1)) { c.fillStyle = 'rgba(255,255,255,.38)'; c.fillRect(X + l, Y + t, s - l - r, s * 0.07); }
    if (!has(x - 1, y)) { c.fillStyle = 'rgba(255,255,255,.16)'; c.fillRect(X + l, Y + t, s * 0.06, s - t - bt); }
    if (!has(x + 1, y)) { c.fillStyle = 'rgba(0,0,0,.12)'; c.fillRect(X + s - r - s * 0.06, Y + t, s * 0.06, s - t - bt); }
  }
  // naden tussen vakjes binnen het stuk
  c.fillStyle = shade(color, -0.3);
  const sw = Math.max(1, s * 0.035);
  for (const [x, y] of cells) {
    if (has(x + 1, y)) c.fillRect(ox + (x + 1) * s - sw / 2, oy + y * s + b, sw, s - b * 2.4);
    if (has(x, y + 1)) c.fillRect(ox + x * s + b, oy + (y + 1) * s - sw / 2, s - b * 2, sw);
  }
  // gebevelde tegel per vakje
  for (const [x, y] of cells) {
    const X = ox + x * s + s * 0.24, Y = oy + y * s + s * 0.22, w = s * 0.52, e = Math.max(1, s * 0.05);
    c.fillStyle = shade(color, 0.32); c.fillRect(X, Y, w, w);
    c.fillStyle = shade(color, -0.22); c.fillRect(X + e, Y + e, w - e, w - e);
    c.fillStyle = shade(color, 0.06); c.fillRect(X + e, Y + e, w - e * 2, w - e * 2);
  }
}

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const nextCv = $('nextcv'), nctx = nextCv.getContext('2d');
const hud = $('hud'), hval = $('hval'), livesEl = $('lives');
const windEl = $('wind'), windArrow = $('windArrow'), windText = $('windText');
const banner = $('banner'), hint = $('hint');

const HEART_SVG = '<svg class="heart" viewBox="0 0 26 24"><path d="M13 22S2 15.2 2 8.4A5.6 5.6 0 0 1 13 6a5.6 5.6 0 0 1 11 2.4C24 15.2 13 22 13 22z"/></svg>';

// titel als gestapelde blokjes
(() => {
  const words = ['STORM', 'TOREN'];
  const cols = ['#4cc9f0','#ffd166','#c77dff','#ff9f43','#4d7cfe','#3ddc97','#ff5d8f'];
  let n = 0;
  $('title').innerHTML = words.map(w => '<div class="row">' + [...w].map(ch => {
    const c = cols[n % cols.length], r = (Math.random()*10-5).toFixed(1), d = (n*0.06 + 0.1).toFixed(2); n++;
    return `<i style="background:${c};--r0:${r*3}deg;transform:rotate(${r}deg);animation-delay:${d}s">${ch}</i>`;
  }).join('') + '</div>').join('');
  $('startControls').innerHTML = finePointer
    ? '<div class="chip"><kbd>← →</kbd>Schuiven</div><div class="chip"><kbd>↑</kbd>Draaien</div><div class="chip"><kbd>↓</kbd>Versnellen</div>'
    : '<div class="chip"><kbd>⇆</kbd>Sleep om te schuiven</div><div class="chip"><kbd>●</kbd>Tik om te draaien</div><div class="chip"><kbd>↓</kbd>Veeg omlaag</div>';
  if (finePointer) hint.innerHTML = '<div class="chip"><kbd>← →</kbd>Schuiven</div><div class="chip"><kbd>↑</kbd>Draaien</div><div class="chip"><kbd>↓</kbd>Versnellen</div>';
})();

/* ---------- audio (gesynthetiseerd) ---------- */
let AC = null, master = null, noiseBuf = null, muted = !settings.sfx;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.8;
    const comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
  } catch (e) { AC = null; }
}
function envGain(t, a, peak, d) {
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); g.connect(master); return g;
}
function tone(freq, dur, type = 'sine', vol = 0.2, slideTo = null, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  o.connect(envGain(t, 0.004, vol, dur)); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, ftype = 'lowpass', freq = 800, q = 0.8, delay = 0, attack = 0.003) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter();
  s.buffer = noiseBuf; s.playbackRate.value = rand(0.8, 1.2);
  f.type = ftype; f.frequency.value = freq; f.Q.value = q;
  s.connect(f); f.connect(envGain(t, attack, vol, dur)); s.start(t, rand(0, 0.5)); s.stop(t + attack + dur + 0.05);
}
const note = i => 523.25 * Math.pow(2, PENTA[Math.min(i, PENTA.length - 1)] / 12);
const sfx = {
  move() { tone(rand(820, 900), 0.035, 'triangle', 0.035, 620); },
  rotate() { tone(420, 0.08, 'triangle', 0.06, 760); noise(0.06, 0.025, 'highpass', 3500); },
  spawn() { tone(1250, 0.05, 'sine', 0.025, 1650); },
  land(k) {
    tone(rand(120, 150), 0.2, 'sine', 0.22 + 0.4*k, 48);
    noise(0.07 + 0.05*k, 0.12 + 0.35*k, 'lowpass', 700 + 1400*k, 1.1);
    tone(rand(380, 460), 0.035, 'square', 0.02 + 0.05*k, 180);
  },
  clack(k) { tone(rand(200, 260), 0.07, 'sine', 0.06 + 0.15*k, 90); noise(0.04, 0.05 + 0.12*k, 'bandpass', 1400, 1.5); },
  settle(i, perfect) {
    const f = note(i);
    tone(f, 0.22, 'sine', perfect ? 0.14 : 0.07);
    tone(f*2, 0.14, 'triangle', perfect ? 0.04 : 0.015, null, 0.015);
    if (perfect) { tone(f*1.5, 0.18, 'sine', 0.06, null, 0.07); noise(0.12, 0.02, 'highpass', 6000, 0.7, 0.05); }
  },
  splash() { noise(0.6, 0.32, 'bandpass', 700, 0.7, 0, 0.01); tone(320, 0.35, 'sine', 0.08, 70); },
  lose() { tone(392, 0.16, 'triangle', 0.12); tone(311, 0.3, 'triangle', 0.12, 260, 0.13); },
  milestone() { [0, 4, 7, 12, 16].forEach((s, i) => tone(523.25*Math.pow(2, s/12), 0.3, 'triangle', 0.11, null, i*0.075)); },
  thunder() { noise(2.2, 0.22, 'lowpass', 160, 0.7, 0, 0.08); noise(0.5, 0.08, 'lowpass', 500, 0.7, 0.05, 0.02); },
  gust() { noise(1.6, 0.06, 'bandpass', 900, 0.6, 0, 0.5); },
  over() { [12, 7, 4, 0].forEach((s, i) => tone(392*Math.pow(2, s/12), 0.35, 'triangle', 0.1, null, i*0.12)); },
};

/* ---------- physics ---------- */
const HZ = 120, STEP = 1000 / HZ, V60 = HZ / 60;   // substeps voor stabiel stapelen; V60 rekent snelheid om naar px per 1/60 s
// geen slaapmodus: slapende blokken werden niet gewekt bij een zachte landing en bleven dan scheef 'bevroren' staan
const engine = Engine.create({ enableSleeping: false, positionIterations: 24, velocityIterations: 18 });
engine.gravity.y = 1;
const world = engine.world;
/* platforms: runs = stenen platen (kolom van t/m), blocks = vaste stenen [kolom, rij boven de plaat] */
const SURVIVAL_DEF = { runs: [[-3, 3]], blocks: [] };
// puzzel: een hoge, smalle rotspilaar (2 breed) die bijna tot aan de laser reikt; je bouwt eromheen
// per rij (van onder naar boven) welke kolommen steen zijn: gaten in de zijkant om blokken in te schuiven, en uitstekende richels
const PILLAR_LAYOUT = [
  [-1, 0],
  [-1, 0, 1],      // richel rechts
  [0],             // gat links
  [-1, 0],
  [-2, -1, 0],     // richel links
  [-1],            // gat rechts
  [-1, 0],
  [-1, 0],
];
const PILLAR_ROWS = PILLAR_LAYOUT.length;
const PUZZLE_DEF = { runs: [[-1, 0]], blocks: [], pillar: true };
PILLAR_LAYOUT.forEach((cols, r) => cols.forEach(c => PUZZLE_DEF.blocks.push([c, r])));
const PUZZLE_START_ROWS = PILLAR_ROWS + 2, RISE_EVERY = 10, RISE_ROWS = 3;
let curDef = SURVIVAL_DEF, platformBodies = [];
function buildPlatform(def) {
  for (const b of platformBodies) Composite.remove(world, b);
  const opts = { isStatic: true, friction: 1, frictionStatic: 3, restitution: 0, label: 'platform' };
  platformBodies = def.runs.map(([a, b]) => Bodies.rectangle((a + b) / 2 * CELL, CELL / 2, (b - a + 1) * CELL, CELL, opts))
    .concat(def.blocks.map(([c, r]) => Bodies.rectangle(c * CELL, -(r + 0.5) * CELL, CELL, CELL, opts)));
  Composite.add(world, platformBodies);
  curDef = def;
}
buildPlatform(SURVIVAL_DEF);
// rotatiedemping: blokken kantelen traag en komen snel tot rust, zodat de toren als één stevig geheel voelt
Events.on(engine, 'beforeUpdate', () => {
  for (const b of world.bodies) {
    if (!b.pd || b.isSleeping || !b.pd.landed) continue;
    Body.setAngularVelocity(b, b.angularVelocity * 0.99);
  }

function makePiece(type) {
  const cells = SHAPES[type];
  const mx = cells.reduce((a, c) => a + c[0], 0) / cells.length;
  const my = cells.reduce((a, c) => a + c[1], 0) / cells.length;
  const offs = cells.map(([cx, cy]) => ({ x: (cx - mx) * CELL, y: (cy - my) * CELL }));
  const parts = offs.map(o => Bodies.rectangle(o.x, o.y, CELL, CELL));
  // zwaar, stroef en traag in rotatie: blokken grijpen in elkaar in plaats van te glijden
  const body = Body.create({ parts, friction: 1, frictionStatic: 3, restitution: 0, density: 0.003, slop: 0.05, frictionAir: 0.012 });   // slop .05: kleinere slop liet schuine blokken langzaam wegkruipen
  Body.setInertia(body, body.inertia * 1.8);
  for (const p of body.parts) { p.friction = 1; p.frictionStatic = 3; p.restitution = 0; p.slop = 0.05; }
  const box = pieceBox(type);
  body.pd = { type, offs, box, sx: -(mx + 0.5) * CELL, sy: -(my + 0.5) * CELL, dropped: false, landed: false, settled: false, ever: false, still: 0, lost: false,

}

/* ---------- state ---------- */
let state = 'menu', paused = false;
let active = null, bag = [], queue = [];

let best = parseFloat(store('st_best') || '0') || 0;

let wind = { phase: 'calm', t: 10, dir: 1, nudgeT: 0, vis: 0 };

let actionsDone = 0;
let mode = 'survival', laserY = null, laserTarget = 0, laserRows = 0, laserHot = 0, laserFail = 0, winT = 0, result = null;
let score = 0, dropped = 0, nextRise = 10, puzzleBest = parseInt(store('st_puzbest') || '0', 10) || 0;
const particles = [], rings = [], floaters = [];

function drawFromBag() {
  if (!bag.length) { bag = TYPES.slice(); for (let i = bag.length - 1; i > 0; i--) { const j = (Math.random()*(i+1))|0; [bag[i], bag[j]] = [bag[j], bag[i]]; } }
  return bag.pop();
}

function fits(p, x, y, a, tol = 2.5) {
  Body.setPosition(p.body, { x, y }); Body.setAngle(p.body, a);
  const others = Composite.allBodies(world);
  for (let i = 1; i < p.body.parts.length; i++) {
    for (const c of Query.collides(p.body.parts[i], others)) if (c.depth > tol) return false;   // een paar pixels schuren mag: blokken glijden makkelijker langs elkaar
  }
  return true;
}

function landedTop() {
  let top = 0;
  for (const b of Composite.allBodies(world)) {
    if (!b.pd || !b.pd.landed || b.pd.lost) continue;
    if (b.bounds.min.y < top) top = b.bounds.min.y;
  }
  return top;
}
function settledTop() {
  let top = 0;
  for (const b of Composite.allBodies(world)) {
    if (!b.pd || !b.pd.settled || b.pd.lost) continue;
    if (b.bounds.min.y < top) top = b.bounds.min.y;
  }
  return top;
}

const fallSpeed = () => (mode === 'puzzle' ? Math.min(1.8 + placed * 0.02, 3.4) : mode === 'race' ? Math.min(2.3 + placed * 0.03, 4.6) : Math.min(1.7 + placed * 0.03, 4.2)) * CELL;

function spawn() {
  const type = queue.shift(); queue.push(drawFromBag());
  const body = makePiece(type);
  const y = mode === 'puzzle' ? laserTarget - 5 * CELL : Math.min(landedTop(), 0) - 11 * CELL;
  const x0 = snapX(body.pd.offs, 0, 0);
  active = { body, type, offs: body.pd.offs, x: x0, y, angle: 0, visX: x0, visAngle: 0, tilt: 0, pop: 0, bump: 0, fast: false };
  if (!fits(active, x0, y, 0)) active.y -= 2 * CELL;
  drawNext(); sfx.spawn();
  sparkle(0, y, COLORS[type], 6);
}

const GRID0 = -PLATFORM_CELLS * CELL / 2;   // rasterlijnen vallen samen met de randen van het platform
function snapX(offs, x, a) {
  const c = Math.round(Math.cos(a)), sn = Math.round(Math.sin(a));
  let mn = Infinity; for (const o of offs) mn = Math.min(mn, o.x * c - o.y * sn);
  const left = x + mn - CELL / 2;
  return x + (Math.round((left - GRID0) / CELL) * CELL + GRID0 - left);
}
function tryMove(dir, byWind) {
  if (!active || paused) return false;
  const nx = active.x + dir * CELL;
  if (Math.abs(nx) > 9 * CELL) return false;
  if (!fits(active, nx, active.y, active.angle)) {
    // inschuifhulp: past het blok een fractie hoger of lager wel (bv. in een gat van de pilaar)? dan schuift het erin
    if (byWind) return false;
    let ok = null;
    for (const dy of [-4, 4, -8, 8, -12, 12, -16, 16]) if (fits(active, nx, active.y + dy, active.angle)) { ok = dy; break; }
    if (ok === null) return false;
    active.y += ok; active.x = nx; active.tilt = clamp(active.tilt + dir * 0.12, -0.22, 0.22);
    tone(660, 0.05, 'square', 0.04, 990); noise(0.05, 0.05, 'highpass', 3000);
    sparkle(nx + dir * CELL, active.y, '#ffd166', 6); noteAction();
    return true;
  }
  active.x = nx; active.tilt = clamp(active.tilt + dir * (byWind ? 0.14 : 0.07), -0.22, 0.22);
  if (!byWind) { sfx.move(); noteAction(); }
  return true;
}
function tryRotate() {
  if (!active || paused) return;
  const na = active.angle + Math.PI / 2;
  const base = snapX(active.offs, active.x, na);
  for (const k of [0, 1, -1, 2, -2]) {
    const nx = base + k * CELL;
    if (Math.abs(nx) <= 9 * CELL && fits(active, nx, active.y, na)) {
      active.angle = na; active.x = nx; active.bump = 1; sfx.rotate(); noteAction();
      return;
    }
  }
  active.tilt += 0.12; tone(180, 0.06, 'square', 0.03);
}
function noteAction() { if (++actionsDone === 4) hint.classList.add('off'); }

function dropActive() {
  const p = active;
  // losduwen: zoek de dichtstbijzijnde plek waar het blok nergens in steekt (eerst omhoog, dan opzij)
  let fx = p.x, fy = p.y;
  search: for (const dy of [0, -1, -2, -3, -4]) for (const dx of [0, -1, 1, -2, 2, -3, 3]) {
    if (fits(p, p.x + dx, p.y + dy, p.angle, 0.3)) { fx = p.x + dx; fy = p.y + dy; break search; }
  }
  p.x = fx; p.y = fy;
  Body.setPosition(p.body, { x: p.x, y: p.y }); Body.setAngle(p.body, p.angle);
  // landingssnelheid begrensd: ook na snel laten vallen landt een blok stevig maar beheerst
  Body.setVelocity(p.body, { x: 0, y: Math.min(p.fast ? 18 * CELL : fallSpeed(), 6 * CELL) / HZ });
  Body.setAngularVelocity(p.body, 0);
  p.body.pd.dropped = true;
  Composite.add(world, p.body);
  active = null; spawnTimer = 0.42;
}

/* ---------- impact / effects ---------- */

    const dir = Math.random() < 0.5 ? -1 : 1;
    particles.push({ t: 'dust', x: x + rand(-6, 6), y: y + rand(-3, 3), vx: dir * rand(20, 90) * (0.5 + k), vy: rand(-40, -5),
      life: 0, max: rand(0.35, 0.7), size: rand(3, 7) * (0.7 + k), color: '214,226,255' });

}
function chips(x, y, color, k) {

  for (let i = 0; i < n; i++) particles.push({ t: 'chip', x, y, vx: rand(-120, 120), vy: rand(-220, -80), rot: rand(0, 6), vr: rand(-12, 12),
    life: 0, max: rand(0.5, 0.9), size: rand(2.5, 4.5), color });
}

function confetti() {

  for (let i = 0; i < 70; i++) particles.push({ t: 'conf', x: rand(left, -left), y: top - rand(0, 80), vx: rand(-40, 40), vy: rand(60, 200),
    rot: rand(0, 6), vr: rand(-8, 8), life: 0, max: rand(1.8, 2.8), size: rand(4, 7), color: COLORS[TYPES[(Math.random()*7)|0]] });
}

function addShake(v) { if (!reduceMotion) shake = Math.min(shake + v, 16); }

Events.on(engine, 'collisionStart', e => {
  if (state === 'menu') return;
  for (const pair of e.pairs) {
    const A = pair.bodyA.parent, B = pair.bodyB.parent;
    if (A.pd) A.pd.wake = true; if (B.pd) B.pd.wake = true;
    const rv = Math.hypot(A.velocity.x - B.velocity.x, A.velocity.y - B.velocity.y) * V60;
    const sup = pair.collision && pair.collision.supports;
    const pt = sup && sup[0] && isFinite(sup[0].x) ? { x: sup[0].x, y: sup[0].y } : { x: (A.position.x + B.position.x) / 2, y: (A.position.y + B.position.y) / 2 };
    let first = null;
    for (const X of [A, B]) if (X.pd && X.pd.dropped && !X.pd.landed) { X.pd.landed = true; X.pd.landT = now; X.pd.maxErr = 0; first = X; }
    const k = clamp(rv / 7, 0, 1);
    if (first) {
      const other = first === A ? B : A;
      first.pd.sq = 0.04 + 0.07 * k; first.pd.sqv = 0; first.pd.flash = 1;
      if (other.pd) { other.pd.sq = Math.max(other.pd.sq, 0.02 + 0.03 * k); other.pd.flash = Math.max(other.pd.flash, 0.35); }
      puff(pt.x, pt.y, k); chips(pt.x, pt.y, COLORS[first.pd.type], k);
      addShake(1.5 + 7 * k); sfx.land(k); haptic(k > 0.45 ? 'heavy' : k > 0.2 ? 'medium' : 'light');
      if (rv > 5) rings.push({ x: pt.x, y: pt.y, r: 4, life: 0, max: 0.35, color: '255,255,255', w: 3 });
    } else if (rv > 1.4) {
      for (const X of [A, B]) {
        if (!X.pd || now - X.pd.lastClack < 0.14) continue;
        X.pd.lastClack = now; X.pd.sq = Math.max(X.pd.sq, 0.02 + 0.03 * k); X.pd.flash = Math.max(X.pd.flash, 0.25);
      }
      if (rv > 2) { puff(pt.x, pt.y, k * 0.5); sfx.clack(k); addShake(1 + 3 * k); }
    }
  }
});

/* magnetisch raster: een blok dat bijna recht tot rust komt, wordt in de eerste seconde na de landing
   zachtjes op het raster getrokken (hoek en x). Daarna is het gewoon vrij en kan het nog bewegen of omvallen. */
/* rustanker: Matter laat blokken die stil op een helling liggen heel langzaam wegkruipen.
   Ligt een blok echt stil, dan zetten we zijn positie vast (snelheid op nul, niets wordt opgespaard).
   Draaien blijft vrij: begint het blok te kantelen, of botst er iets tegenaan, dan laat het anker los. */
/* ligt dit blok ergens óp (contact met iets eronder)? Alleen schuren langs een zijkant telt niet. */
function supportedFromBelow(b) {
  for (const pair of engine.pairs.list) {
    if (!pair.isActive) continue;
    const A = pair.bodyA.parent, B = pair.bodyB.parent;
    if (A !== b && B !== b) continue;
    const ny = A === b ? -pair.collision.normal.y : pair.collision.normal.y;   // Matter: normaal wijst van B naar A
    if (ny > 0.5) return true;
  }
  return false;
}
function wakeIfNeighbourMoves(b, d) {
  for (const pair of engine.pairs.list) {
    if (!pair.isActive) continue;
    const A = pair.bodyA.parent, B = pair.bodyB.parent;
    const o = A === b ? B : B === b ? A : null;
    if (!o || o.isStatic || !o.pd || o.pd.anchor) continue;
    if (o.speed * V60 > 0.3 || Math.abs(o.angularVelocity) * V60 > 0.01) { d.wake = true; return; }
  }
}
function restAnchor(b, d) {
  if (d.anchor) {
    const A = d.anchor;
    if (d.wake || Math.abs(b.angle - A.a) > 0.015 || !supportedFromBelow(b)) { d.anchor = null; d.restN = 0; d.wake = false; return; }
    Body.setPosition(b, { x: A.x, y: A.y }); Body.setVelocity(b, { x: 0, y: 0 });
    return;
  }
  d.wake = false;
  const q = Math.PI / 2, tilted = Math.abs(b.angle - Math.round(b.angle / q) * q) > 0.02;
  if (!tilted && now - (d.landT || 0) < 1.15) { d.restN = 0; return; }     // rechte blokken: eerst rasteren
  const slow = b.speed * V60 < 0.12 && Math.abs(b.angularVelocity) * V60 < 0.004;
  if (!slow || !supportedFromBelow(b)) { d.restN = 0; return; }
  if (++d.restN > (tilted ? 10 : 30)) d.anchor = { x: b.position.x, y: b.position.y, a: b.angle };
}
function gridSnap(b, d) {
  const age = now - (d.landT || 0);
  if (age > 1.1) return;
  const q = Math.PI / 2, ta = Math.round(b.angle / q) * q, aErr = ta - b.angle;
  d.maxErr = Math.max(d.maxErr || 0, Math.abs(aErr));
  // alleen de horizontale positie rechtzetten; de hoek laten we vrij zodat kantelen nooit wordt tegengehouden
  if (Math.abs(aErr) > 0.02) return;
  if (b.speed * V60 > 1.2 || Math.abs(b.angularVelocity) * V60 > 0.02) return;
  const tx = snapX(d.offs, b.position.x, ta), dx = tx - b.position.x;
  if (Math.abs(dx) > 9 || Math.abs(dx) < 0.05 || !supportedFromBelow(b)) return;
  // niet rasteren als het blok daardoor in een buur zou schuiven
  const ox = b.position.x;
  Body.setPosition(b, { x: ox + dx * 0.22, y: b.position.y });
  const others = Composite.allBodies(world).filter(o => o !== b);
  for (let i = 1; i < b.parts.length; i++) for (const c of Query.collides(b.parts[i], others)) {
    if (c.depth > 0.6 && Math.abs(c.normal.x) > 0.7) { Body.setPosition(b, { x: ox, y: b.position.y }); return; }
  }
}
function onSettle(b) {

  const perfect = err < 0.035;
  placed++;
  if (perfect) { streak++; perfects++; } else streak = 0;
  sfx.settle(perfect ? streak : 0, perfect);
  b.pd.glow = 1;
  const col = COLORS[b.pd.type];
  rings.push({ x: b.position.x, y: b.position.y, r: 10, life: 0, max: 0.5, color: perfect ? '255,209,102' : '255,255,255', w: perfect ? 4 : 2 });
  if (perfect) {
    sparkle(b.position.x, b.position.y, '#ffd166', 8 + Math.min(streak, 8) * 2);
    floater(b.position.x, b.bounds.min.y - 10, streak > 1 ? `Strak! ×${streak}` : 'Strak!', '#ffd166', 14 + Math.min(streak, 6));
  } else sparkle(b.position.x, b.position.y, col, 4);
}

function loseLife(b) {
  b.pd.lost = true; if (mode === 'survival') lives--; streak = 0;
  for (let i = 0; i < 26; i++) particles.push({ t: 'drop', x: b.position.x + rand(-20, 20), y: SEA_Y, vx: rand(-90, 90), vy: rand(-320, -120),
    life: 0, max: rand(0.6, 1.1), size: rand(2, 5), color: '214,236,242' });
  rings.push({ x: b.position.x, y: SEA_Y, r: 8, life: 0, max: 0.7, color: '214,236,242', w: 3, flat: true });
  sfx.splash(); setTimeout(() => sfx.lose(), 150);
  addShake(8); hurtA = 1;
  haptic('heavy');
  if (mode === 'puzzle') { dropped++; floater(b.position.x, SEA_Y - 24, 'In zee!', '#d6ecf2', 14); return; }
  if (mode === 'race') { penalty += RACE_PENALTY; floater(b.position.x, SEA_Y - 24, `+${RACE_PENALTY} s`, '#ff8fb0', 16); return; }
  renderHearts(true);
  if (lives <= 0 && state === 'play') { state = 'dying'; overTimer = 1.6; active = null; }
}

/* ---------- input ---------- */
let ptr = null;
cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || paused) return;
  cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
  ptr = { id: e.pointerId, x0: e.clientX, y0: e.clientY, lx: e.clientX, t0: performance.now(), acc: 0, moved: false };
});
cv.addEventListener('pointermove', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  const dx = e.clientX - ptr.lx; ptr.lx = e.clientX; ptr.acc += dx;
  const step = CELL * SCALE * 0.8;
  while (ptr.acc > step) { tryMove(1); ptr.acc -= step; }
  while (ptr.acc < -step) { tryMove(-1); ptr.acc += step; }
  const tdx = e.clientX - ptr.x0, tdy = e.clientY - ptr.y0;
  if (Math.hypot(tdx, tdy) > 12) ptr.moved = true;
  if (active) active.fast = tdy > 46 && tdy > Math.abs(tdx) * 1.2;
});
function endPtr(e) {
  if (!ptr || e.pointerId !== ptr.id) return;
  if (!ptr.moved && performance.now() - ptr.t0 < 320) tryRotate();
  if (active) active.fast = false;
  ptr = null;
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
addEventListener('keydown', e => {
  if (state !== 'play') { if ((e.key === 'Enter' || e.key === ' ') && state === 'over') { e.preventDefault(); restartCurrent(); } return; }
  if (e.key === 'p' || e.key === 'Escape') { setPaused(!paused); return; }
  if (paused) return;
  if (e.key === 'ArrowLeft' || e.key === 'a') { tryMove(-1); e.preventDefault(); }
  else if (e.key === 'ArrowRight' || e.key === 'd') { tryMove(1); e.preventDefault(); }
  else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ' || e.key === 'x') { if (!e.repeat) tryRotate(); e.preventDefault(); }
  else if (e.key === 'ArrowDown' || e.key === 's') { if (active) active.fast = true; e.preventDefault(); }
});
addEventListener('keyup', e => { if ((e.key === 'ArrowDown' || e.key === 's') && active) active.fast = false; });

const padEl = $('pad');
for (const btn of padEl.querySelectorAll('.pad-btn')) {
  const act = btn.dataset.act; let delay = null, rep = null;
  const stop = () => {
    btn.classList.remove('pressed'); clearTimeout(delay); clearInterval(rep);
    if (act === 'down' && active) active.fast = false;
  };
  btn.addEventListener('pointerdown', e => {
    e.preventDefault(); initAudio();
    if (state !== 'play' || paused) return;
    btn.setPointerCapture && btn.setPointerCapture(e.pointerId);
    btn.classList.add('pressed');
    if (act === 'rotate') tryRotate();
    else if (act === 'down') { if (active) active.fast = true; noteAction(); }
    else {
      const dir = act === 'left' ? -1 : 1; tryMove(dir);
      delay = setTimeout(() => { rep = setInterval(() => tryMove(dir), 70); }, 190);
    }
  });
  btn.addEventListener('pointerup', stop); btn.addEventListener('pointercancel', stop); btn.addEventListener('lostpointercapture', stop);
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

}

}

let last = performance.now(), acc = 0;
function update(dt) {

  if (playing) {

    if (!active && queue.length) { spawnTimer -= dt; if (spawnTimer <= 0) spawn(); }
    if (active) {
      const p = active;

      const ny = p.y + (p.fast ? 18 * CELL : fallSpeed()) * dt;
      if (fits(p, p.x, ny, p.angle)) p.y = ny;
      else {
        let lo = p.y, hi = ny;
        for (let i = 0; i < 7; i++) { const m = (lo + hi) / 2; if (fits(p, p.x, m, p.angle)) lo = m; else hi = m; }
        p.y = lo; dropActive();
      }
      if (active && active.y > 3 * CELL) dropActive();
    }
    if (mode === 'survival') updateWind(dt);
  }
  if (active) {
    const p = active;
    p.visX += (p.x - p.visX) * (1 - Math.exp(-dt * 22));
    p.visAngle += (p.angle - p.visAngle) * (1 - Math.exp(-dt * 20));

  }

  if (simulate) {
    acc += dt * 1000; let n = 0;
    while (acc >= STEP && n < 8) { Engine.update(engine, STEP); acc -= STEP; n++; }
    if (n === 8) acc = 0;
    for (const b of Composite.allBodies(world)) {
      const d = b.pd; if (!d) continue;
      // jelly-veer voor squash
      d.sqv += -0.32 * d.sq; d.sqv *= 0.78; d.sq += d.sqv;
      d.flash = Math.max(0, d.flash - dt * 5); d.glow = Math.max(0, d.glow - dt * 2.2);
      if (!d.lost && b.position.y > SEA_Y) { if (state === 'play') loseLife(b); else d.lost = true; }
      if (b.position.y > SEA_Y + 600) { Composite.remove(world, b); continue; }
      if (!d.landed || d.lost) continue;
      if (d.anchor && !d.wake) wakeIfNeighbourMoves(b, d);
      gridSnap(b, d);
      restAnchor(b, d);
      if (b.isSleeping || (b.speed * V60 < 0.12 && Math.abs(b.angularVelocity) * V60 < 0.004)) d.still++;
      else { d.still = 0; if (d.settled && b.speed * V60 > 1.6) d.settled = false; }
      if (!d.settled && d.still > 16) { d.settled = true; if (!d.ever && state === 'play') { d.ever = true; onSettle(b); } }
    }
    if (state === 'play' && mode === 'puzzle') puzzleCheck(dt);
    if (state === 'play' && mode === 'race') raceCheck(dt);
    if (state === 'play' && mode === 'survival') {
      curH = Math.max(0, -settledTop() / CELL * M_PER_CELL);
      if (curH > maxH) {
        maxH = curH;
        if (maxH >= nextMilestone) {
          showBanner(`${nextMilestone} m`, ['Lekker bezig!', 'Hij staat als een huis', 'Boven de meeuwen', 'In de wolken!', 'Duizelingwekkend'][Math.min(nextMilestone / 5 - 1, 4) | 0]);
          sfx.milestone(); confetti(); nextMilestone += 5; haptic('success');
        } else if (!recordBeaten && best > 0 && maxH > best) {

        }
      }

    }
  }
  if (state === 'dying' && !paused) { overTimer -= dt; if (overTimer <= 0) gameOver(); }

  // camera
  if (mode === 'puzzle' && laserY !== null) laserY += (laserTarget - laserY) * (1 - Math.exp(-dt * 3));

  wind.vis += (wv - wind.vis) * (1 - Math.exp(-dt * 2));

}

function updateWind(dt) {
  if (placed < 8) return;
  wind.t -= dt;
  if (wind.phase === 'calm' && wind.t <= 0) {
    wind.phase = 'warn'; wind.t = 1.8; wind.dir = Math.random() < 0.5 ? -1 : 1;
    windEl.hidden = false; windEl.classList.add('warn'); windText.textContent = 'Windstoot op komst';
    windArrow.style.transform = wind.dir < 0 ? 'scaleX(-1)' : '';
  } else if (wind.phase === 'warn' && wind.t <= 0) {
    wind.phase = 'gust'; wind.t = rand(2.8, 4.2); wind.nudgeT = 0.25;
    windEl.classList.remove('warn'); windText.textContent = wind.dir > 0 ? 'Wind naar rechts' : 'Wind naar links'; sfx.gust();
  } else if (wind.phase === 'gust') {
    wind.nudgeT -= dt;
    if (wind.nudgeT <= 0) { wind.nudgeT = 0.95; tryMove(wind.dir, true); }

/* ---------- render ---------- */

}
function drawShadow(b) {

function render(t) {

  if (alt > 0) { ctx.fillStyle = `rgba(6,8,24,${alt * 0.6})`; ctx.fillRect(0, 0, cw, ch); }
  const starA = 0.25 + alt * 0.75;

    ctx.fillStyle = `rgba(230,236,255,${a.toFixed(3)})`;

    const y = ((c.y * ch * 0.5 + ch * 0.4) - camY * c.par * K) % (ch * 1.6);

  // rotspilaren onder elke plaat

  for (const [a, b2] of curDef.runs) {
    const x0 = (a - 0.5) * CELL, x1 = (b2 + 0.5) * CELL, w = x1 - x0, n = 7, depth = SEA_Y + CELL;
    const spread = curDef.runs.length === 1 ? -w * 0.32 : Math.min(w * 0.2, 20);

  }

    ctx.fillStyle = 'rgba(30,36,80,.28)'; ctx.fillRect(x + 8, y + 8, CELL - 16, CELL - 17);

    gg.addColorStop(0, 'rgba(214,226,255,.09)'); gg.addColorStop(1, 'rgba(214,226,255,0)');

  }

  // mijlpaal-lijn

    const gg = ctx.createLinearGradient(0, gy0, 0, gy0 + 14 * CELL);
    gg.addColorStop(0, 'rgba(214,226,255,.13)'); gg.addColorStop(1, 'rgba(214,226,255,0)');
    ctx.fillStyle = gg; ctx.fillRect(gx0, gy0, gx1 - gx0, 14 * CELL);
    ctx.strokeStyle = 'rgba(214,226,255,.28)'; ctx.lineWidth = 1.2; ctx.setLineDash([4, 6]);
    ctx.lineDashOffset = -t * 0.02;
    ctx.beginPath(); ctx.moveTo(gx0, gy0); ctx.lineTo(gx0, gy0 + 14 * CELL); ctx.moveTo(gx1, gy0); ctx.lineTo(gx1, gy0 + 14 * CELL); ctx.stroke();
    ctx.setLineDash([]);
  }

  // blokken
  const bodies = Composite.allBodies(world).filter(b => b.pd && b.position.y < bottom + 60 && b.position.y > top - 200);
  ctx.globalAlpha = 0.28; for (const b of bodies) drawShadow(b); ctx.globalAlpha = 1;
  for (const b of bodies) drawBody(b);

  // actief blok
  if (active) {
    const p = active, d = p.body.pd, sc = easeOutBack(p.pop) * (1 + p.bump * 0.1);
    ctx.save(); ctx.translate(p.visX, p.y); ctx.scale(sc, sc); ctx.rotate(p.visAngle + p.tilt);
    ctx.shadowColor = COLORS[p.type]; ctx.shadowBlur = 18 * K * (0.6 + 0.4 * Math.sin(t * 0.006));
    blit(d, 'color');
    ctx.shadowBlur = 0;
    if (p.fast) { ctx.globalAlpha = 0.18; blit(d, 'white'); ctx.globalAlpha = 1; }
    ctx.restore();
    if (p.fast) {
      ctx.strokeStyle = 'rgba(214,226,255,.35)'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 4; i++) { const lx = p.visX + rand(-40, 40); ctx.beginPath(); ctx.moveTo(lx, p.y - 30 - rand(0, 30)); ctx.lineTo(lx, p.y - 70 - rand(0, 40)); ctx.stroke(); }
    }

    const gl = ctx.createLinearGradient(0, laserY - 10, 0, laserY + 10);
    gl.addColorStop(0, 'rgba(255,70,120,0)'); gl.addColorStop(0.5, `rgba(255,70,120,${(0.22 + 0.25 * hot + 0.08 * pulse).toFixed(3)})`); gl.addColorStop(1, 'rgba(255,70,120,0)');
    const ex = Math.max(6, Math.max(...curDef.runs.flat().map(Math.abs)) + 3.5) * CELL;
    ctx.fillStyle = gl; ctx.fillRect(-ex, laserY - 10, ex * 2, 20);
    ctx.fillStyle = hot > 0.3 ? '#ffffff' : '#ff5d8f'; ctx.fillRect(-ex, laserY - 1, ex * 2, 2);
    ctx.fillStyle = `rgba(255,220,230,${(0.5 + 0.5 * pulse).toFixed(3)})`; ctx.fillRect(-ex, laserY - 0.4, ex * 2, 0.8);

      ctx.fillStyle = '#ff5d8f'; ctx.fillRect(sx2 - 4, laserY - 3, 8, 6);
      ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillRect(sx2 - 7, laserY - 10, 14, 2);
    }
    ctx.font = '10px "Lilita One", "Trebuchet MS", sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';

  }

  for (const r of rings) {

  }
  for (const q of particles) {

    else if (q.t === 'drop') { ctx.fillStyle = `rgba(${q.color},${(1 - k).toFixed(3)})`; ctx.beginPath(); ctx.arc(q.x, q.y, q.size * (1 - k * 0.5), 0, 7); ctx.fill(); }

    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(40,24,0,.75)'; ctx.strokeText(f.text, 0, 0);

  // scherm-overlays: regen, bliksem, schade
  ctx.setTransform(1, 0, 0, 1, 0, 0);

}

function drawFinish(t, left, right) {
  const y = finishY, sq = 8;
  ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(left, y - 30, right - left, 30);
  for (let x = Math.floor(left / sq) * sq, i = 0; x < right; x += sq, i++) {
    ctx.fillStyle = i % 2 ? '#f3f1ff' : '#12172e'; ctx.fillRect(x, y - sq, sq, sq);
    ctx.fillStyle = i % 2 ? '#12172e' : '#f3f1ff'; ctx.fillRect(x, y - sq * 2, sq, sq);
  }
  ctx.font = '12px "Lilita One", "Trebuchet MS", sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = '#ffd166'; ctx.fillText(`FINISH ${RACE_ROWS * M_PER_CELL} m`, left + 26, y - sq * 2 - 3);

    ctx.fillStyle = '#3ddc97'; ctx.fillRect(-w / 2, y - 54, w * k, 14);

function drawPillar() {

    if (r % 2) ctx.fillRect(x + CELL / 2 - 1, y, 2, CELL - 2); else if (!has(c - 1, r)) {} else ctx.fillRect(x - 1, y, 2, CELL - 2);
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(x, y, CELL, 2);
    if (!has(c - 1, r)) { ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x, y, 2, CELL); }
    if (!has(c + 1, r)) { ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x + CELL - 3, y, 3, CELL); }
    if (!has(c, r - 1) && r > 0) { ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(x, y + CELL - 3, CELL, 3); }
    // mos op elke bovenkant zonder steen erboven
    if (!has(c, r + 1)) {

function drawSea(t, left, right, bottom, layer) {
  if (SEA_Y - 30 > bottom) return;

  ctx.beginPath(); ctx.moveTo(left, bottom + 40);
  for (let x = left; x <= right + 10; x += 10) ctx.lineTo(x, base + Math.sin(x * 0.028 + t * sp) * amp + Math.sin(x * 0.011 - t * 0.0007) * amp * 0.7);
  ctx.lineTo(right + 10, bottom + 40); ctx.closePath();
  if (layer) {
    const g = ctx.createLinearGradient(0, base, 0, base + 160); g.addColorStop(0, '#16566a'); g.addColorStop(1, '#0a2533');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(214,236,242,.55)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = left; x <= right + 10; x += 10) { const y = base + Math.sin(x * 0.028 + t * sp) * amp + Math.sin(x * 0.011 - t * 0.0007) * amp * 0.7; x === left ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
  } else { ctx.fillStyle = 'rgba(30,96,116,.85)'; ctx.fill(); }
}

function drawLine(y, left, right, rgb, label, a) {
  ctx.strokeStyle = `rgba(${rgb},${a * 0.6})`; ctx.lineWidth = 1.5; ctx.setLineDash([8, 7]);
  ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke(); ctx.setLineDash([]);
  ctx.font = '11px "Lilita One", "Trebuchet MS", sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = `rgba(${rgb},${a})`; ctx.fillText(label, right - 30, y - 3);
}

/* ---------- loop ---------- */
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t; now += dt;
  update(paused ? 0 : dt);
  render(t);
  requestAnimationFrame(frame);
}
resize();
renderHearts(false);
window.__storm = () => ({ state, mode, lives, placed, ax: active ? active.x : null, ay: active ? active.y : null, at: active ? active.type : null, result,  bodies: world.bodies.filter(b => b.pd).map(b => ({ t: b.pd.type, x: +b.position.x.toFixed(1), y: +b.position.y.toFixed(1), a: +(b.angle * 180 / Math.PI).toFixed(1), lost: b.pd.lost })) });
requestAnimationFrame(t => { last = t; frame(t); });
})();
